<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>О нас — Ascend Trade & Logistics</title>
<meta name="description" content="Ascend Trade & Logistics — консалтинговая компания в сфере ВЭД и логистики в Азербайджане.">
<link rel="icon" href="assets/logo-main.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="about">
<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <div class="crumb" data-reveal><a href="index.html" data-i18n="nav.home"></a><span class="sep">/</span><span data-i18n="ab.crumb"></span></div>
    <h1 data-reveal data-i18n="ab.htitle"></h1>
    <p data-reveal data-delay="1" data-i18n="ab.hsub"></p>
  </div>
</section>

<!-- INTRO SPLIT -->
<section class="section">
  <div class="container">
    <div class="split">
      <div data-reveal>
        <span class="eyebrow" data-i18n="ab.eyebrow"></span>
        <h2 data-i18n="ab.title"></h2>
        <p style="margin:18px 0" data-i18n="ab.p1"></p>
        <p data-i18n="ab.p2"></p>
      </div>
      <div data-reveal data-delay="2" style="position:relative">
        <div class="about-img">
          <div class="world-map" id="worldmap-about" role="img" aria-label="Global delivery routes to Azerbaijan"></div>
        </div>
        <div class="float-stat" style="bottom:-24px;left:-16px">
          <div class="n">500+</div><div class="t" data-i18n="sb.s1t"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- MISSION / VISION -->
<section class="section" style="background:var(--bg-soft)">
  <div class="container">
    <div class="grid grid-2">
      <div class="card" data-reveal data-delay="1">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></div>
        <h3 data-i18n="ab.mv1t"></h3><p data-i18n="ab.mv1d"></p>
      </div>
      <div class="card" data-reveal data-delay="2">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <h3 data-i18n="ab.mv2t"></h3><p data-i18n="ab.mv2d"></p>
      </div>
    </div>
  </div>
</section>

<!-- VALUES -->
<section class="section">
  <div class="container">
    <div class="section-head center mx-auto" data-reveal>
      <div class="center"><span class="eyebrow" data-i18n="ab.valt"></span></div>
      <h2 data-i18n="ab.valt"></h2>
    </div>
    <div class="grid grid-4">
      <div class="card" data-reveal data-delay="1"><div class="num-bg">01</div><h3 data-i18n="ab.val1"></h3><p data-i18n="ab.val1d"></p></div>
      <div class="card" data-reveal data-delay="2"><div class="num-bg">02</div><h3 data-i18n="ab.val2"></h3><p data-i18n="ab.val2d"></p></div>
      <div class="card" data-reveal data-delay="3"><div class="num-bg">03</div><h3 data-i18n="ab.val3"></h3><p data-i18n="ab.val3d"></p></div>
      <div class="card" data-reveal data-delay="4"><div class="num-bg">04</div><h3 data-i18n="ab.val4"></h3><p data-i18n="ab.val4d"></p></div>
    </div>
  </div>
</section>

<!-- STATS -->
<section class="section-sm stats-band">
  <div class="container">
    <div class="grid grid-4">
      <div class="stat" data-reveal data-delay="1"><div class="n"><span data-count="500">0</span><span class="suf">+</span></div><div class="t" data-i18n="sb.s1t"></div></div>
      <div class="stat" data-reveal data-delay="2"><div class="n"><span data-count="5">0</span></div><div class="t" data-i18n="sb.s2t"></div></div>
      <div class="stat" data-reveal data-delay="3"><div class="n"><span data-count="98">0</span><span class="suf">%</span></div><div class="t" data-i18n="sb.s3t"></div></div>
      <div class="stat" data-reveal data-delay="4"><div class="n"><span data-count="24">0</span><span class="suf">/7</span></div><div class="t" data-i18n="sb.s4t"></div></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="cta" data-reveal>
      <h2 data-i18n="cta.title"></h2>
      <p data-i18n="cta.sub"></p>
      <div class="btns">
        <a class="btn btn-light" href="contact.html" data-i18n="cta.btn1"></a>
        <a class="btn btn-outline-light" href="services.html" data-i18n="hero.cta2"></a>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/i18n.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="js/map.js"></script>
</body>
</html>
