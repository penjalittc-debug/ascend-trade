<body data-page="contact">
<a class="skip-link" href="#main" data-i18n="nav.skip">Əsas məzmuna keç</a>
<div id="site-header"></div>
<main id="main">

<section class="page-hero">
  <div class="container">
    <div class="crumb" data-reveal><a href="index.html" data-i18n="nav.home"></a><span class="sep">/</span><span data-i18n="ct.crumb"></span></div>
    <h1 data-reveal data-i18n="ct.htitle"></h1>
    <p data-reveal data-delay="1" data-i18n="ct.hsub"></p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="contact-grid">
      <div class="contact-left" data-reveal>
        <span class="eyebrow" data-i18n="ct.eyebrow"></span>
        <h2 data-i18n="ct.title"></h2>
        <p style="margin:16px 0 34px" data-i18n="ct.sub"></p>
        <div class="contact-info">
          <div class="contact-item">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2z"/></svg></span>
            <div><div class="k" data-i18n="ct.phone"></div><a class="v" data-site="phone" href="tel:">+994 51 665 65 75</a></div>
          </div>
          <div class="contact-item">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
            <div><div class="k" data-i18n="ct.email"></div><a class="v" data-site="email" href="mailto:">Penjalittc@gmail.com</a></div>
          </div>
          <div class="contact-item">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
            <div><div class="k" data-i18n="ct.addr"></div><div class="v" data-i18n="ct.addrv"></div></div>
          </div>
          <div class="contact-item">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
            <div><div class="k" data-i18n="ct.hours"></div><div class="v" data-i18n="ft.hours"></div></div>
          </div>
        </div>
      </div>

      <form class="form" data-reveal data-delay="2" data-ajax action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value=""><!-- заполняется из js/config.js (SITE.web3formsKey) -->
        <input type="hidden" name="subject" value="Yeni sorğu — Ascend Trade & Logistics">
        <input type="hidden" name="from_name" value="Ascend Trade & Logistics">
        <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
        <div class="form-row">
          <div class="field"><label data-i18n="ct.fname"></label><input type="text" name="name" required></div>
          <div class="field"><label data-i18n="ct.femail"></label><input type="email" name="email" required></div>
        </div>
        <div class="form-row">
          <div class="field"><label data-i18n="ct.fphone"></label><input type="tel" name="phone"></div>
          <div class="field"><label data-i18n="ct.fsubject"></label>
            <select name="service">
              <option value="FEA consulting" data-i18n="ct.opt1"></option>
              <option value="Product sourcing" data-i18n="ct.opt2"></option>
              <option value="Manufacturer search" data-i18n="ct.opt3"></option>
              <option value="Cargo delivery" data-i18n="ct.opt4"></option>
              <option value="Other" data-i18n="ct.opt5"></option>
            </select>
          </div>
        </div>
        <div class="field"><label data-i18n="ct.fmsg"></label><textarea name="message" required></textarea></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" data-i18n="ct.fsend"></button>
        <p class="form-status" data-status hidden></p>
        <p style="font-size:.82rem;margin-top:14px;text-align:center" data-i18n="ct.note"></p>
      </form>
    </div>
  </div>
</section>

</main>
<div id="site-footer"></div>
