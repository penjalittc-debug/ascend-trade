<!DOCTYPE html>

<meta name="description" content="Ascend Trade & Logistics — консалтинг ВЭД, поиск товаров и производителей, доставка грузов из Китая, Турции, Ирана, России и Казахстана в Азербайджан.">
<link rel="icon" href="assets/logo-main.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="home">

<!-- HERO -->
<section class="hero">
  <div class="hero-glow a"></div>
  <div class="hero-glow b"></div>
  <div class="container">
    <div class="hero-text" data-reveal>
      <span class="hero-badge"><span class="dot"></span><span data-i18n="hero.badge"></span></span>
      <h1 data-i18n="hero.title" data-i18n-html></h1>
      <p class="hero-sub" data-i18n="hero.sub"></p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="contact.html" data-i18n="hero.cta1"></a>
        <a class="btn btn-outline-light" href="services.html" data-i18n="hero.cta2"></a>
      </div>
      <div class="hero-stats">
        <div><div class="num" data-i18n="hero.stat1n"></div><div class="lbl" data-i18n="hero.stat1l"></div></div>
        <div><div class="num" data-i18n="hero.stat2n"></div><div class="lbl" data-i18n="hero.stat2l"></div></div>
        <div><div class="num" data-i18n="hero.stat3n"></div><div class="lbl" data-i18n="hero.stat3l"></div></div>
      </div>
    </div>
    <div class="hero-visual" data-reveal data-delay="2">
      <div class="map-card">
        <h4 data-i18n="hero.mapt"></h4>
        <div class="cap" data-i18n="hero.mapc"></div>
        <div class="corridor-list">
          <div class="corridor">
            <span class="flag">🇨🇳</span>
            <div class="route"><div class="from" data-i18n="dir.china"></div>
              <div class="path"><span class="arrow"></span><span class="to" data-i18n="dir.toaz"></span></div></div>
            <span class="mode" data-i18n="mode.multi"></span>
          </div>
          <div class="corridor">
            <span class="flag">🇹🇷</span>
            <div class="route"><div class="from" data-i18n="dir.turkey"></div>
              <div class="path"><span class="arrow"></span><span class="to" data-i18n="dir.toaz"></span></div></div>
            <span class="mode" data-i18n="mode.auto"></span>
          </div>
          <div class="corridor">
            <span class="flag">🇮🇷</span>
            <div class="route"><div class="from" data-i18n="dir.iran"></div>
              <div class="path"><span class="arrow"></span><span class="to" data-i18n="dir.toaz"></span></div></div>
            <span class="mode" data-i18n="mode.auto"></span>
          </div>
          <div class="corridor">
            <span class="flag">🇷🇺</span>
            <div class="route"><div class="from" data-i18n="dir.russia"></div>
              <div class="path"><span class="arrow"></span><span class="to" data-i18n="dir.toaz"></span></div></div>
            <span class="mode" data-i18n="mode.rail"></span>
          </div>
          <div class="corridor">
            <span class="flag">🇰🇿</span>
            <div class="route"><div class="from" data-i18n="dir.kz"></div>
              <div class="path"><span class="arrow"></span><span class="to" data-i18n="dir.toaz"></span></div></div>
            <span class="mode" data-i18n="mode.multi"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="hero-scroll"><span data-i18n="hero.scroll"></span><span class="mouse"></span></div>
</section>

<div class="trustbar">
  <div class="container">
    <span class="lead" data-i18n="trust.lead"></span>
    <div class="flags">
      <span class="fl"><span class="flag">🇨🇳</span><span data-i18n="dir.china"></span></span>

      <span class="fl"><span class="flag">🇷🇺</span><span data-i18n="dir.russia"></span></span>
      <span class="fl"><span class="flag">🇰🇿</span><span data-i18n="dir.kz"></span></span>
    </div>
  </div>
</div>

        <h3 data-i18n="hs.c2t"></h3><p data-i18n="hs.c2d"></p>

        <a class="more" href="services.html"><span data-i18n="hs.more"></span> →</a>
